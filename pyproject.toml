[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-atlas-memory"
version = "0.1.0"
description = "Local-first memory foundation for ATLAS on Hermes Agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
"nexus.extraction" = ["prompt_v2.txt"]
"nexus.eval" = ["fixtures/*.json"]
"nexus.templates" = ["*.md"]
"nexus.index" = ["schema.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
