name: nexus
version: 0.1.0
description: "Local-first, provenance-backed memory for ATLAS."
author: "Abidin Yildiz"
kind: standalone
manifest_version: 1
api_version: 1
platforms:
  - macos
provides_hooks:
  - pre_llm_call
config_schema:
  vault_path:
    type: str
    required: true
    description: "Absolute path to the existing Obsidian Vault."
  inbox_path:
    type: str
    default: "~/Nexus/Inbox"
    description: "Human drop folder; ingestion remains dry-run in Phase 3."
  data_path:
    type: str
    default: "~/.local/share/nexus"
    description: "Private runtime data outside the synced Vault."
  timezone:
    type: str
    default: "Europe/Istanbul"
  raw_retention_days:
    type: int
    default: 90
  rejected_retention_days:
    type: int
    default: 30
  max_source_bytes:
    type: int
    default: 52428800
    description: "Maximum accepted Inbox file size (50 MiB by default)."
  source_stable_seconds:
    type: int
    default: 5
    description: "Minimum unchanged age before an Inbox file is considered stable."
  auto_publish_enabled:
    type: bool
    default: false
  sensitive_auto_publish:
    type: bool
    default: false
  decision_classifier_enabled:
    type: bool
    default: false
    description: "Experimental classifier.dev live-route; shadow only, default off."
  decision_llm_fallback_enabled:
    type: bool
    default: false
    description: "Optional Hermes structured-route fallback; shadow only, default off."
  decision_classifier_executable:
    type: str
    default: "classify"
    description: "Basename classify or an absolute classifier CLI path."
  decision_high_confidence:
    type: str
    default: "0.85"
    description: "Recorded candidate threshold; not enforced for execution in Phase A."
  decision_low_risk_min:
    type: str
    default: "0.60"
    description: "Recorded low-risk threshold; not enforced for execution in Phase A."
  decision_timeout_seconds:
    type: str
    default: "2.5"
    description: "Classifier timeout in seconds (hard cap 15)."
  decision_log_enabled:
    type: bool
    default: true
    description: "Shadow-route JSONL logging under data_path (privacy-safe)."
  decision_log_preview:
    type: bool
    default: false
    description: "Opt-in 48-char preview in the shadow log; default off."
  decision_log_path:
    type: str
    default: "logs/classifier.jsonl"
    description: "Relative to data_path; absolute paths are rejected."
